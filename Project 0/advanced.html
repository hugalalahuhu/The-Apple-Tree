<html>
 <head>
    <title>Advanced Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://kit.fontawesome.com/4f891e4697.js" crossorigin="anonymous"></script>    </head>

 </head> 
 <body>
    <style>
        html,body{
            overflow: hidden;
        }
        .container1{
            padding: 0%;
            margin: 0%;
        }
        input{ width: 20vw; height: 8vh; border: 0.1px rgb(203, 201, 201) solid; border-radius: 5px; }
        #notme{
            height: max-content;
            padding-left: 1%;
            padding-right: 1%;
            padding-top: 0.5%;
            padding-bottom: 0.5%;
            width: max-content;
            background-color:blue;

        }
        #notme:hover{
            background-color:rgb(0, 0, 180);
        }
        .topones{
    background-color: white;
    border: 0px;
}
    </style>
    <div style="position: absolute;right: 0px;">
        <button type="button" class="topones" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Image">
        <a href="image.html"><i class="fas fa-image" style="font-size:x-large;"></i></a>
        </button>
        <button type="button" class="topones" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Search">
        <a href="index.html"><i class="fa-solid fa-house" style="margin-right: 10px;font-size:x-large;"></i></a>
        </button>
        </div>
<div class="container1" >
    <div class="row" style="padding-top: 4vh;padding-bottom: 2vh; padding-left: 2vw;">
        <a href="index.html" style="text-decoration: none;"><h1 id="logo"><span style="color: aqua;">G</span><span style="color:orangered;">o</span><span style="color: gold;">o</span><span style="color: aqua;">g</span><span style="color: greenyellow ;">l</span><span style="color: orangered;">e</span></h1></a>
    </div>

<hr style="width: 100vw;">
<div class="container">
    <div class="row">
        <p style="font-size: 28px;">Advanced Search</p>
    </div>
    <div class="row mb-3">
        <p style="font-size: 20px;">Find pages with</p>
    </div>
    <div class="row">
        <form action="https://www.google.com/search" method="get">
            <div class="row mb-3">
            
            <label for="as_q" class="col-4">All of these words:</label>
            <input name="as_q" type="text" id="as_q" class="col-4">
            <div class="col-4"></div>
            </div>
            <div class="row mb-3">
            <label for="as_epq" class="col-4">This exact word or phrase:</label>
            <input name="as_epq" type="text" id="as_epq" class="col-4">
                        <div class="col-4"></div>

            </div>
            <div class="row mb-3">
            <label for="as_eq" class="col-4">None of these words:</label>
            <input name="as_eq" type="text" id="as_eq" class="col-4">
                        <div class="col-4"></div>

            </div>
            <div class="row mb-3">
            <label for="as_sitesearch" class="col-4">Site or domain:</label>
            <input name="as_sitesearch" type="text" id="as_sitesearch" class="col-4">
                        <div class="col-4"></div>

            </div>
            <div class="row">
            <div style="display: flex; justify-content: flex-end;">
            <button type="submit" id="notme" style="border: 0px; border-radius: 25px;color: white;" >Advanced search</button>
            </div>
            </div>
        </form>
    </div>
</div>
</div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script>
            var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
            var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl)})
        </script>
 </body>  
</html>
